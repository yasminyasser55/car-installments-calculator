<!DOCTYPE html>
<html>
<head>
    <title>AutoLoan Pro</title>
    <link rel="stylesheet" href="style.css" 
</head>
<body>

    <h1>AutoLoan Pro</h1>

    <form>
        <p>
            <label>Car Brand:</label><br>
            <input type="text" id="carBrand">
        </p>

        <p>
            <label>Car Model (Year):</label><br>
            <input type="number" id="carModel">
        </p>

        <p>
            <label>Total Car Price:</label><br>
            <input type="number" id="carPrice">
        </p>

        <p>
            <label>Down Payment:</label><br>
            <input type="number" id="downPayment">
        </p>

        <p>
            <label>Loan Term (Months):</label><br>
            <select id="loanTerm">
                <option value="12">12 Months</option>
                <option value="24">24 Months</option>
                <option value="36" selected>36 Months</option>
                <option value="48">48 Months</option>
                <option value="60">60 Months</option>
                <option value="72">72 Months</option>
                <option value="84">84 Months</option>
            </select>
        </p>

        <hr>

        <h3>Results:</h3>
        <p>Interest Rate: <b id="interestRateDisplay">0%</b></p>
        <p>Monthly Payment: <b id="monthlyInstallmentDisplay">$0</b></p>
    </form>   
    <script src="script.js"></script>
</body>
</html>
